<text x="1388" y="1126" class="h" >Review → Pi → release</text>
<text x="1388" y="1153" class="b" >Local review approval</text>
<text x="1388" y="1176" class="b" >Linux vcan + testbench</text>
<text x="1388" y="1199" class="b" >Pi performance validation</text>
<text x="1388" y="1222" class="b" >Separate production approval</text>
</g>
