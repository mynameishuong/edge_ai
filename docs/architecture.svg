<text x="1056" y="1126" class="h" >Versioned artifact</text>
<text x="1056" y="1153" class="b" >Model + feature schema + profile</text>
<text x="1056" y="1176" class="b" >Threshold + fingerprint + report</text>
<text x="1056" y="1199" class="b" >Candidate version for review</text>
<text x="1056" y="1222" class="b" >No automatic promotion</text>
</g>
<g id="arch-D5" data-arch-ref="D5">
<rect x="1370" y="1075" width="266" height="165" rx="11" fill="#142033" stroke="#40526b"/>
