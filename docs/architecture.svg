<g id="arch-D1" data-arch-ref="D1">
<rect x="42" y="1075" width="296" height="165" rx="11" fill="#142033" stroke="#40526b"/>
<text x="60" y="1098" class="tag" >D1 / 6% · REAL DATA · PENDING</text>
<text x="60" y="1126" class="h" >Collect &amp; curate</text>
<text x="60" y="1153" class="b" >HCRL / ROAD / own lab captures</text>
<text x="60" y="1176" class="b" >Normalize timestamp + CAN fields</text>
<text x="60" y="1199" class="b" >Split by capture/session first</text>
<text x="60" y="1222" class="b" >Real datasets: not evaluated</text>
</g>
<g id="arch-D2" data-arch-ref="D2">
<rect x="374" y="1075" width="296" height="165" rx="11" fill="#122c37" stroke="#326c75"/>
<text x="392" y="1098" class="tag" >D2 / 5% · DEMO ONLY · PARTIAL</text>
<text x="392" y="1126" class="h" >Build normal feature sets</text>
<text x="392" y="1153" class="b" >Same C++ extractor as runtime</text>
<text x="392" y="1176" class="b" >Train normal sessions only</text>
<text x="392" y="1199" class="b" >Validation normal: pick threshold</text>
<text x="392" y="1222" class="b" >Hold out entire test sessions</text>
</g>
<g id="arch-D3" data-arch-ref="D3">
<rect x="706" y="1075" width="296" height="165" rx="11" fill="#122c37" stroke="#326c75"/>
<text x="724" y="1098" class="tag" >D3 / 9% · LOCAL MODEL · QUALITY GAP</text>
<text x="724" y="1126" class="h" >Train → export → verify</text>
<text x="724" y="1153" class="b" >Python / scikit-learn on PC</text>
<text x="724" y="1176" class="b" >Export tree nodes, not pickle</text>
<text x="724" y="1199" class="b" >Compare Python vs C++ scores</text>
<text x="724" y="1222" class="b" >Payload shift: 1/40 above threshold</text>
</g>
<g id="arch-D4" data-arch-ref="D4">
<rect x="1038" y="1075" width="296" height="165" rx="11" fill="#122c37" stroke="#326c75"/>
