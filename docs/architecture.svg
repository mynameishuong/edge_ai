<rect x="42" y="1265" width="1594" height="136" rx="12" fill="#251f1b" stroke="#665032"/>
<text x="62" y="1295" class="tag" >BOUNDARIES THAT MATTER</text>
<text x="62" y="1324" class="b" >An anomaly score does not identify an attacker or prove spoofing/replay. Signal-level checks require DBC and context.</text>
<text x="62" y="1351" class="b" >Local prototype is synchronous. Bounded capture/logging queues, storage retention and automated rollback are future work.</text>
<text x="62" y="1378" class="b" >100 ms aggregation + processing + debounce determines detection delay. Model P95 alone is not end-to-end latency.</text>
<text x="42" y="1454" class="label" >Teal boxes: implemented local path     Muted boxes / dashed links: target architecture or unvalidated hardware path</text>
<text x="42" y="1478" class="label" >Percentages = estimated effort allocation across the review plan, NOT completion, accuracy or measured timing.</text>
</svg>